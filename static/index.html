<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zählerstand-Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>⚡ Zählerstand-Tracker</h1>

        <section class="card">
            <h2>Zählerstand erfassen</h2>
            <form id="reading-form">
                <label>Datum <input type="date" id="reading-date" required></label>
                <label>Zählerstand (kWh) <input type="number" id="reading-value" step="0.1" min="0" required></label>
                <button type="submit">Speichern</button>
            </form>
            <p id="message" class="message"></p>
        </section>

        <section class="card">
            <h2>Auswertung</h2>
            <div class="tariff">
                <label>Arbeitspreis (ct/kWh) <input type="number" id="price" value="35" step="0.1" min="0.1"></label>
                <label>Grundpreis (€/Monat) <input type="number" id="base-fee" value="12" step="0.5" min="0"></label>
            </div>
            <div id="summary" class="summary">Mindestens zwei Zählerstände erfassen.</div>
        </section>

        <section class="card">
            <h2>Erfasste Zählerstände</h2>
            <table>
                <thead><tr><th>Datum</th><th>Zählerstand</th><th></th></tr></thead>
                <tbody id="readings-table"></tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
